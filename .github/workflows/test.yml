name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim-version: [stable, nightly]

    steps:
      - uses: actions/checkout@v6

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Setup tree-sitter
        uses: tree-sitter/setup-action@v2
        with:
          install-lib: false

      - name: Cache Tree-sitter parsers
        uses: actions/cache@v5
        with:
          path: deps/parsers
          key: parsers-${{ hashFiles('tests/minimal_init.lua') }}
          restore-keys: |
            parsers-

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: deps
          key: deps-${{ hashFiles('Makefile') }}
          restore-keys: |
            deps-

      - name: Install dependencies
        run: make deps

      - name: Run tests
        run: |
          nvim -V1 -v
          make test
