name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim-version: [stable, nightly]
        deps-mode: [pinned, nightly]

    steps:
      - uses: actions/checkout@v6

      - name: Set DEPS_MODE
        run: echo "DEPS_MODE=${{ matrix.deps-mode }}" >> $GITHUB_ENV

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim-version }}

      - name: Setup tree-sitter
        uses: tree-sitter/setup-action@v2
        with:
          install-lib: false

      - name: Cache dependencies (pinned)
        if: matrix.deps-mode == 'pinned'
        uses: actions/cache@v5
        with:
          path: deps
          key: deps-pinned-${{ hashFiles('Makefile') }}

      - name: Cache dependencies (nightly)
        if: matrix.deps-mode == 'nightly'
        uses: actions/cache@v5
        with:
          path: deps
          key: deps-nightly-${{ github.run_id }}
          restore-keys: |
            deps-nightly-

      - name: Install dependencies
        run: make deps

      - name: Run tests
        run: |
          nvim -V1 -v
          make test
